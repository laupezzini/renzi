function pop(t,a,d=.45){const x=eb((t-a)/d);return `opacity:${cl((t-a)/.15)};transform:translateY(${(1-x)*40}px) scale(${.85+.15*x})`}
function star(x,y,r,c,rot=0){let p='';for(let i=0;i<10;i++){const a=i*Math.PI/5+rot,rr=i%2?r*.42:r;p+=`${x+Math.sin(a)*rr},${y-Math.cos(a)*rr} `}return `<polygon points="${p}" fill="${c}"/>`}
function spark(x,y,r,c='url(#gold)',rot=0){return `<path transform="translate(${x} ${y}) rotate(${rot})" d="M0 ${-r} Q${r*.14} ${-r*.14} ${r} 0 Q${r*.14} ${r*.14} 0 ${r} Q${-r*.14} ${r*.14} ${-r} 0 Q${-r*.14} ${-r*.14} 0 ${-r}Z" fill="${c}"/>`}
function nieve(t){let s='';for(let i=0;i<40;i++){const x=(i*137+40)%1080,y=((t*(60+i%5*14)+i*211)%2100)-90,xx=x+Math.sin(t*1.3+i)*14;
 if(i%3==0)s+=spark(xx,y,10+i%4*3,['url(#gold)','#f4b6c2',SG][i%3==0?(i/3)%3:0],t*40+i*20);else if(i%3==1)s+=`<circle cx="${xx}" cy="${y}" r="${4+i%3*2}" fill="#fff" stroke="#eadfcc" stroke-width="1.5"/>`;else s+=star(xx,y,7+i%4*2,[R,SG,GD,'#f4b6c2'][i%4],t+i)}return `<g opacity=".6">${s}</g>`}
const leaf=(x,y,l,a,c)=>`<g transform="translate(${x} ${y}) rotate(${a})"><path d="M0 0 Q${l*.5} ${-l*.32} ${l} 0 Q${l*.5} ${l*.32} 0 0Z" fill="${c}"/><path d="M2 0 L${l*.85} 0" stroke="#fff" stroke-opacity=".45" stroke-width="2"/></g>`;
const flor=(x,y,r,c,n=5)=>`<g transform="translate(${x} ${y})">${[...Array(n)].map((_,k)=>`<ellipse cx="0" cy="${-r*.55}" rx="${r*.42}" ry="${r*.6}" fill="${c}" transform="rotate(${k*360/n})"/>`).join('')}<circle r="${r*.28}" fill="${GD}"/><circle r="${r*.12}" fill="#d9a24a"/></g>`;
const cinta=(x,y,l,c,ph)=>`<path d="M${x} ${y} L${x} ${y+l+ph} L${x+7} ${y+l-10+ph} L${x+14} ${y+l+ph} L${x+14} ${y}Z" fill="${c}"/>`;

function agenda(){let lv='';const pos=[[-120,-190,20],[-20,-220,-30],[90,-175,40],[-140,-60,-20],[120,-40,10],[-110,90,30],[-20,150,-40],[100,120,20],[30,215,0],[-150,200,-10]];
 pos.forEach(([x,y,a],i)=>{lv+=leaf(x,y,58,a+i*17,i%2?SG:SG2)+leaf(x,y,46,a+i*17+140,i%2?SG2:SG)});
 [[-60,-120],[40,-100],[-80,130],[70,180],[150,-210]].forEach(([x,y],i)=>lv+=flor(x,y,22-i%2*5,i%2?'#f4b6c2':'#eea3b4'));
 return `<rect x="-176" y="-246" width="380" height="520" rx="10" fill="url(#edge)"/><rect x="-176" y="250" width="372" height="22" fill="url(#edgeV)"/>
 <defs><clipPath id="ca"><rect x="-190" y="-260" width="380" height="520" rx="12"/></clipPath></defs>
 <rect x="-190" y="-260" width="380" height="520" rx="12" fill="url(#cvP)"/><g clip-path="url(#ca)">${lv}<rect x="-190" y="-260" width="380" height="520" filter="url(#tex)"/></g>
 <rect x="-190" y="-260" width="34" height="520" fill="#e39cad"/><path d="M-173 -240 L-173 240" stroke="#fff" stroke-width="3" stroke-dasharray="12 10" opacity=".8"/>
 <rect x="-190" y="-260" width="380" height="520" rx="12" fill="url(#sheen)"/>
 <rect x="-100" y="-60" width="210" height="120" rx="12" fill="${CR}" style="filter:drop-shadow(0 4px 6px rgba(0,0,0,.12))"/><rect x="-90" y="-50" width="190" height="100" rx="8" fill="none" stroke="${G}" stroke-width="2"/>
 <text x="5" y="-18" text-anchor="middle" font-family="H" font-size="30" fill="${R}">agenda</text><text x="5" y="32" text-anchor="middle" font-family="P" font-size="52" fill="${G}">2027</text>
 ${cinta(50,268,70,R,0)}${cinta(80,268,90,G,0)}`}
function cuaderno(){const fl=[[-60,-140,78,'url(#pBlue)'],[80,-10,66,'url(#pLila)'],[-50,140,60,'url(#pRosa)'],[110,-190,48,'url(#pNar)'],[100,180,40,'url(#pBlue)']];
 let f='';fl.forEach(([x,y,r,c],i)=>{f+=leaf(x-r*.3,y+r*.6,r*1.1,110+i*30,SG2)+leaf(x+r*.2,y+r*.7,r*.9,60-i*20,SG)});
 fl.forEach(([x,y,r,c],i)=>{f+=`<g transform="translate(${x} ${y})">${[...Array(8)].map((_,k)=>`<path d="M0 0 Q${r*.28} ${-r*.5} 0 ${-r} Q${-r*.28} ${-r*.5} 0 0Z" fill="${c}" transform="rotate(${k*45+i*10})"/>`).join('')}<circle r="${r*.22}" fill="${GD}"/>${[...Array(6)].map((_,k)=>`<circle cx="${Math.cos(k)*r*.12}" cy="${Math.sin(k)*r*.12}" r="2.5" fill="#b07a2a"/>`).join('')}</g>`});
 return `<rect x="-166" y="-236" width="360" height="500" rx="8" fill="url(#edge)"/><rect x="-166" y="244" width="352" height="20" fill="url(#edgeV)"/>
 <defs><clipPath id="cc"><rect x="-180" y="-250" width="360" height="500" rx="10"/></clipPath></defs>
 <rect x="-180" y="-250" width="360" height="500" rx="10" fill="url(#cvF)"/><g clip-path="url(#cc)">${f}<rect x="-180" y="-250" width="360" height="500" fill="url(#weave)"/><rect x="-180" y="-250" width="360" height="500" filter="url(#tex)"/></g>
 <rect x="-180" y="-250" width="30" height="500" fill="#3f57a8"/><rect x="-180" y="-250" width="30" height="500" fill="url(#weave)"/>

 <rect x="-180" y="-250" width="360" height="500" rx="10" fill="url(#sheen)"/>${cinta(120,246,60,'#3f57a8',0)}`}
function libreta(c=G,band=R,txt='ideas'){const dk=c==G?'#24493a':c==R?'#a82e52':'#4f7a5e';
 return `<rect x="-126" y="-188" width="272" height="392" rx="14" fill="url(#edge)"/><rect x="-140" y="-200" width="280" height="400" rx="18" fill="${c}"/><rect x="-140" y="-200" width="280" height="400" rx="18" filter="url(#tex)"/>
 <rect x="-140" y="-200" width="22" height="400" rx="10" fill="${dk}" opacity=".5"/>
 <circle cx="-5" cy="-40" r="64" fill="none" stroke="${dk}" stroke-width="10"/><circle cx="-5" cy="-40" r="64" fill="none" stroke="url(#gold)" stroke-width="4"/>${star(-5,-40,36,'url(#gold)')}
 <text x="-5" y="100" text-anchor="middle" font-family="H" font-size="58" fill="url(#gold)">${txt}</text><path d="M-60 125 Q-5 140 50 125" stroke="url(#gold)" stroke-width="3" fill="none"/>
 <rect x="84" y="-200" width="18" height="400" fill="${band}"/><rect x="88" y="-200" width="4" height="400" fill="#fff" opacity=".35"/>
 <rect x="-140" y="-200" width="280" height="400" rx="18" fill="url(#sheen)"/>${cinta(-60,195,60,GD,0)}`}
function pila(){return `<g transform="translate(-125 40) rotate(-11) scale(.92)">${libreta(SG2,'#f4b6c2','notas')}</g><g transform="translate(125 40) rotate(11) scale(.92)">${libreta(R,CR,'gracias')}</g><g transform="translate(0 -10)">${libreta(G,R,'ideas')}</g>

 <g transform="translate(-40 250)"><rect x="-110" y="-44" width="320" height="92" rx="46" fill="${CR}" stroke="${LN}" stroke-width="3" style="filter:drop-shadow(0 6px 10px rgba(0,0,0,.12))"/><text x="50" y="16" text-anchor="middle" font-family="D" font-size="40" fill="${G}">x 10, x 20…</text></g>`}
function saludo(){return `<g transform="rotate(-6)">${libreta(G,R,'ideas')}</g><path d="M95 -175 C150 -240 225 -215 240 -150" stroke="#a37d55" stroke-width="5" fill="none" stroke-dasharray="2 3"/>
 <g transform="translate(235 -60) rotate(12)" style="filter:drop-shadow(0 8px 10px rgba(0,0,0,.15))"><path d="M-110 -50 L-70 -90 L110 -90 L110 90 L-70 90 L-110 50 Z" fill="url(#kraft)"/><path d="M-110 -50 L-70 -90 L110 -90 L110 90 L-70 90 L-110 50 Z" fill="none" stroke="#b89466" stroke-width="2" stroke-dasharray="6 5" transform="scale(.92)"/>
 <circle cx="-78" cy="0" r="11" fill="#fbf6ea" stroke="#a37d55" stroke-width="3"/>
 <text x="15" y="-10" text-anchor="middle" font-family="H" font-size="46" fill="${R}">¡Gracias</text><text x="15" y="42" text-anchor="middle" font-family="H" font-size="38" fill="${G}">por este año!</text>${spark(85,-62,12)}</g>`}
// caja de regalo con volumen
function caja(fill,rib,pat,lidOff=0,lidRot=0,lidOp=1){const D=46;
 const side=`<path d="M230 -40 L${230+D} ${-40-D*.6} L${230+D} ${260-D*.6} L230 260Z" fill="${fill}" style="filter:brightness(.72)"/>`;
 const front=`<rect x="-230" y="-40" width="460" height="300" rx="6" fill="${fill}"/><rect x="-230" y="-40" width="460" height="300" rx="6" fill="url(#${pat})"/><rect x="-230" y="-40" width="460" height="300" rx="6" fill="url(#sheen)"/>
  <rect x="-30" y="-40" width="60" height="300" fill="url(#${rib})"/><path d="M230 -40 L${230+D} ${-40-D*.6} L${230+D} ${260-D*.6} L230 260Z" fill="none"/>`;
 const lid=`<g transform="translate(${lidOff*300} ${-lidOff*260}) rotate(${lidRot})" opacity="${lidOp}">
  <path d="M-255 -120 L${-255+D} ${-120-D*.6} L${255+D} ${-120-D*.6} L255 -120Z" fill="${fill}" style="filter:brightness(1.12)"/><path d="M-30 -120 L${-30+D} ${-120-D*.6} L${30+D} ${-120-D*.6} L30 -120Z" fill="url(#${rib})"/>
  <path d="M255 -120 L${255+D} ${-120-D*.6} L${255+D} ${-30-D*.6} L255 -30Z" fill="${fill}" style="filter:brightness(.75)"/>
  <rect x="-255" y="-120" width="510" height="90" rx="6" fill="${fill}"/><rect x="-255" y="-120" width="510" height="90" rx="6" fill="url(#${pat})"/><rect x="-255" y="-120" width="510" height="90" rx="6" fill="url(#sheen)"/><rect x="-30" y="-120" width="60" height="90" fill="url(#${rib})"/>
  <g transform="translate(${D/2} ${-140})">
   <path d="M0 0 C-60 -80 -170 -70 -150 -10 C-140 30 -60 20 0 0Z" fill="url(#${rib})" stroke="#000" stroke-opacity=".08" stroke-width="2"/><path d="M-20 -5 C-60 -40 -110 -40 -120 -15" stroke="#000" stroke-opacity=".12" stroke-width="4" fill="none"/>
   <path d="M0 0 C60 -80 170 -70 150 -10 C140 30 60 20 0 0Z" fill="url(#${rib})" stroke="#000" stroke-opacity=".08" stroke-width="2"/><path d="M20 -5 C60 -40 110 -40 120 -15" stroke="#000" stroke-opacity=".12" stroke-width="4" fill="none"/>
   <path d="M-8 10 L-60 110 L-38 96 L-30 122 L8 14Z" fill="url(#${rib})"/><path d="M8 10 L55 105 L32 94 L22 118 L-6 14Z" fill="url(#${rib})"/>
   <ellipse cx="0" cy="2" rx="28" ry="24" fill="url(#${rib})" stroke="#000" stroke-opacity=".1" stroke-width="2"/></g></g>`;
 const top=`<path d="M-230 -40 L${-230+D} ${-40-D*.6} L${230+D} ${-40-D*.6} L230 -40Z" fill="#3a2a2a" opacity=".55"/>`+
  [[-200,'#fbe3e8'],[-120,'#fffdf8'],[-40,'#f8cdd5'],[40,'#fffdf8'],[120,'#fbe3e8'],[200,'#fffdf8']].map(([x,c],k)=>`<path d="M${x-50} -38 L${x+8} ${-40-D*.6-38-(k%2)*16} L${x+60} -38Z" fill="${c}" stroke="#e8d6cc" stroke-width="2"/>`).join('');
 return `<ellipse cx="20" cy="268" rx="330" ry="40" fill="url(#floor)"/>${side}${top}${front}${lid}`}
const BOX={[G]:['url(#bxG)','dots'],[R]:['url(#bxR)','stripes'],[SG2]:['url(#bxS)','snowp']};
const RIB={[BL]:'rbPK',[CR]:'rbCR',[GD]:'rbGD','#f4b6c2':'rbPK'};
function regalo(t,t0,cx,cy,prod,boxc,ribc,ps=1){const ap=eb((t-t0)/.5),lid=eo((t-t0-.45)/.5),up=eb((t-t0-.65)/.7);const [f,p]=BOX[boxc]||BOX[G],rb=RIB[ribc]||'rbGD';
 const box=`<g transform="translate(${cx} ${cy}) scale(${ap})">${caja(f,rb,p,lid,lid*35,1-cl((t-t0-1.0)/.35))}</g>`;
 const sp=up>0.05?[...Array(10)].map((_,i)=>{const a=i*Math.PI/5,r=170+up*250,k=1-cl((t-t0-.65)/1.8);return spark(cx+Math.cos(a)*r,cy-260+Math.sin(a)*r*.7,22*k,i%2?'url(#gold)':'#f4b6c2',t*60)}).join(''):'';
 const pr=`<g transform="translate(${cx} ${cy-up*330}) scale(${(.3+.7*up)*ps}) rotate(${(1-up)*-12})" opacity="${cl(up*3)}" style="${SH}">${prod()}</g>`;
 return `${box}${sp}${pr}`}
function etiqueta(t,t0,txt,precio){return `<div style="position:absolute;left:0;right:0;top:1480px;text-align:center;${pop(t,t0)}"><span style="display:inline-block;background:${G};color:#fff;font-family:D;font-size:44px;padding:18px 40px 22px;border-radius:999px;box-shadow:0 12px 26px rgba(47,93,70,.25)">${txt}${precio?` <span style="color:${GD}">· ${precio}</span>`:''}</span></div>`}
function persona(t,a,b,l1,l2,prod,boxc,ribc,txt,precio){const o=win(t,a,b);if(o<=0)return '';
 return `<div class="g" style="opacity:${o}"><div class="tt" style="top:290px"><div class="mid" style="${pop(t,a+.05)};font-size:84px">${l1}</div><div class="scr" style="${pop(t,a+.3)};font-size:112px">${l2}</div></div>
 <svg class="g" width="1080" height="1920">${regalo(t,a+.5,540,1250,prod,boxc,ribc)}</svg>${etiqueta(t,a+1.45,txt,precio)}</div>`}
function scene(t){let h=`<svg class="g" width="1080" height="1920">${nieve(t)}</svg>`;
 // 0 · gancho
 let o=win(t,0,3.2);if(o>0){const w=Math.sin(t*6)*4;h+=`<div class="g" style="opacity:${o}"><div class="tt" style="top:380px"><div class="mid" style="${pop(t,.05)}">Mandale este video</div><div class="scr" style="${pop(t,.35)};font-size:120px">a quien te tiene<br>que regalar</div><div class="mid" style="${pop(t,.8)}">en Navidad</div></div>
  <svg class="g" width="1080" height="1920"><g transform="translate(540 1390) rotate(${w}) scale(${eb((t-.9)/.5)*.8})">${caja('url(#bxR)','rbCR','stripes')}</g>${[0,1,2,3].map(k=>spark(540+Math.cos(t*2+k*1.6)*330,1250+Math.sin(t*2+k*1.6)*200,18+6*Math.sin(t*5+k),'url(#gold)',t*50)).join('')}</svg></div>`}
 h+=persona(t,3.0,6.8,'Para la que anota','todo en post-its',agenda,G,BL,'Agenda 2027','desde $40.000');
 h+=persona(t,6.6,10.4,'Para el que dice','«no necesito nada»',cuaderno,R,CR,'Cuaderno de tela','$28.000');
 h+=persona(t,10.2,14.0,'Para la que siempre','tiene una idea',libreta,SG2,'#f4b6c2','Libretas hechas a mano','desde $8.000');
 h+=persona(t,13.8,17.6,'Para la empresa','que saluda a su equipo',pila,G,GD,'Regalos corporativos','consultá por cantidad');
 h+=persona(t,17.4,21.2,'Para saludar a alguien','por fin de año',saludo,R,GD,'Un presente hecho a mano','');
 // 4 · y para vos
 o=win(t,21,24.8);if(o>0){const it=[[agenda,320,1180,.62,21.6],[cuaderno,540,1250,.66,21.8],[libreta,770,1190,.7,22]];
  h+=`<div class="g" style="opacity:${o}"><div class="tt" style="top:290px"><div class="mid" style="${pop(t,21.05)}">Y para vos,</div><div class="scr" style="${pop(t,21.35)};font-size:112px">porque también<br>te lo merecés</div></div><svg class="g" width="1080" height="1920">`+
  it.map(([f,x,y,s,a])=>{const k=eb((t-a)/.6);return `<g transform="translate(${x} ${y+(1-k)*200}) scale(${s*k}) rotate(${(x-540)/30})" style="${SH}">${f()}</g>`}).join('')+[0,1,2,3,4].map(k=>spark(200+k*170,900+Math.sin(t*3+k)*30,14+5*Math.sin(t*4+k))).join('')+`</svg></div>`}
 // 5 · hecho a mano
 o=win(t,24.6,27.4);if(o>0){const x=eb((t-24.8)/.6);h+=`<div class="g" style="opacity:${o}"><div style="position:absolute;left:330px;top:420px;width:420px;height:420px;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 20px 50px rgba(90,60,40,.18);transform:scale(${.8+.2*x}) rotate(${(1-x)*-10}deg);opacity:${cl((t-24.8)/.3)}"><img src="logo_renzi.png" style="width:100%;height:100%"></div>
  <div class="tt" style="top:940px"><div class="mid" style="${pop(t,25.1)}">Hechos a mano,</div><div class="scr" style="${pop(t,25.4)}">hilo por hilo</div><div class="k" style="${pop(t,25.8)};margin-top:30px;color:${G}">en La Plata</div></div></div>`}
 // 6 · llamado
 o=cl((t-27.2)/.35);if(o>0){h+=`<div class="g" style="opacity:${o}"><div class="tt" style="top:300px">
  <div class="scr" style="${pop(t,27.3)};font-size:120px">Regalá algo</div><div class="big" style="${pop(t,27.5)}">hecho a mano</div>
  <div class="sub" style="${pop(t,27.8)};margin-top:14px">pedí con tiempo para Navidad</div>
  <div class="sub" style="${pop(t,28.05)};font-size:44px">regalos corporativos: consultanos</div>
  <div style="${pop(t,28.1)};margin-top:34px;display:inline-block;background:#e3f1e6;color:${G};font-family:D;font-size:38px;padding:14px 34px 16px;border-radius:999px">Agendas 2027 en preventa hasta el 20/11</div>
  <div style="${pop(t,28.4)};display:block;margin:40px auto 0;width:max-content;background:${R};color:#fff;font-family:D;font-size:54px;line-height:1.2;padding:24px 46px 28px;border-radius:28px;box-shadow:0 14px 30px rgba(214,69,107,.28)">Mirá todos los precios<br><span style="font-size:42px">renzi-cuadernos.pages.dev</span></div>
  <div class="sub" style="${pop(t,28.8)};margin-top:34px;font-size:50px;color:${G}">Etiquetá a quien te tiene que regalar</div></div>
  <div style="position:absolute;left:0;right:0;top:1500px;height:150px;background:${G};display:flex;align-items:center;justify-content:center;gap:26px;color:#fff;font-family:D;font-size:44px;${pop(t,29.1)}"><span>WhatsApp 221 577-0018</span><span style="width:2px;height:70px;background:rgba(255,255,255,.4)"></span><span>@renzi.librosusados</span></div></div>`}
 C.innerHTML=h}
// ritmo: tiempo de salida -> tiempo de la animación (tramos lineales)
const K_OUT=[0,2.4,5.3,8.2,11.1,14.0,16.9,19.8,21.8,23.4,27.2], K_IN=[0,3.0,6.6,10.2,13.8,17.4,21.0,24.6,27.2,29.2,33];
function remap(t){for(let i=1;i<K_OUT.length;i++){if(t<=K_OUT[i]){const r=(t-K_OUT[i-1])/(K_OUT[i]-K_OUT[i-1]);return K_IN[i-1]+r*(K_IN[i]-K_IN[i-1])}}return K_IN[K_IN.length-1]}
window.render=t=>scene(remap(t)); scene(0);
</script></body></html>
