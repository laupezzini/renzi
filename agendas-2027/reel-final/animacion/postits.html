<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Ds;src:url(dancing-700.woff2)}@font-face{font-family:D;src:url(dmsans-800.woff2)}@font-face{font-family:P;src:url(playfair-700.woff2)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 40%,#c9a47b 0%,#b48c63 60%,#9c7651 100%)}
body:before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 30% 20%,rgba(255,255,255,.035) 0 2px,transparent 2px 5px),repeating-radial-gradient(circle at 70% 70%,rgba(0,0,0,.04) 0 2px,transparent 2px 6px)}
.n{position:absolute;width:300px;height:280px;padding:34px 30px;box-sizing:border-box;font-family:Ds;font-size:54px;line-height:1.05;color:#333;box-shadow:0 14px 26px rgba(60,35,15,.35);opacity:0;transform:scale(.4) rotate(var(--r));animation:pop .35s cubic-bezier(.3,1.6,.6,1) forwards;animation-delay:var(--d)}
.n:after{content:"";position:absolute;left:0;right:0;top:0;height:34px;background:rgba(0,0,0,.05)}

.y{background:#fde68a}.p{background:#fbcfe8}.g{background:#bbf7d0}.b{background:#bfdbfe}.o{background:#fed7aa}
.t{position:absolute;left:60px;right:60px;text-align:center;color:#fff;font-family:D;font-size:78px;line-height:1.1;text-shadow:0 6px 24px rgba(0,0,0,.55);opacity:0;animation:fade .4s ease forwards;animation-delay:var(--d)}
.t span{background:rgba(25,20,15,.72);padding:10px 26px 16px;border-radius:24px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
@keyframes fade{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.out{animation:fade .4s ease forwards, gone .3s ease forwards;animation-delay:var(--d),1.9s}
@keyframes gone{to{opacity:0}}
</style></head><body>
