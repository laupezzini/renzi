<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Bangers"; src: url("assets/fonts/bangers.woff2") format("woff2"); }
      @font-face { font-family: "DM Sans"; src: url("assets/fonts/dmsans-800.woff2") format("woff2"); font-weight: 800; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #222; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .scene svg.full { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      .label { position: absolute; left: 0; right: 0; top: 40px; text-align: center; font-family: "DM Sans", sans-serif; font-weight: 800; font-size: 44px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="2">

      <!-- ============ A: CARTOON DE TV ============ -->
      <div id="a" class="scene clip" data-start="0" data-duration="1" data-track-index="0">
        <svg class="full" viewBox="0 0 1080 1920">
          <defs>
            <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="7" fill="#ffb703" /></pattern>
          </defs>
          <rect width="1080" height="1920" fill="#ffd23f" />
          <rect width="1080" height="1920" fill="url(#dots)" opacity=".55" />
          <!-- action burst -->
          <path d="M540,300 L600,560 L840,420 L700,640 L1000,700 L720,800 L900,1020 L640,900 L620,1180 L520,930 L330,1120 L400,860 L110,860 L360,720 L160,500 L420,580 Z" fill="#fff" stroke="#1d1d2b" stroke-width="10" stroke-linejoin="round" />
          <g stroke="#1d1d2b" stroke-width="11" stroke-linejoin="round" stroke-linecap="round">
            <!-- noodle legs -->
            <path d="M470,1700 C460,1790 430,1840 380,1860" fill="none" />
            <path d="M610,1700 C620,1790 650,1840 700,1860" fill="none" />
            <ellipse cx="365" cy="1868" rx="70" ry="32" fill="#e63946" />
            <ellipse cx="715" cy="1868" rx="70" ry="32" fill="#e63946" />
            <!-- bean body -->
            <path d="M380,1360 C360,1220 450,1150 540,1150 C630,1150 720,1220 700,1360 L690,1640 C690,1720 620,1740 540,1740 C460,1740 390,1720 390,1640 Z" fill="#2ec4b6" />
            <path d="M470,1190 L540,1260 L610,1190" fill="none" stroke-width="9" />
            <!-- hair bun + back hair -->
            <circle cx="540" cy="430" r="95" fill="#ff7b39" />
            <path d="M260,760 C240,560 380,470 540,470 C700,470 840,560 820,760 C860,880 840,1000 800,1060 L280,1060 C240,1000 220,880 260,760 Z" fill="#ff7b39" />
            <!-- head (big, squashy) -->
            <path d="M290,800 C290,610 410,560 540,560 C670,560 790,610 790,800 C790,1000 690,1110 540,1110 C390,1110 290,1000 290,800 Z" fill="#ffcc9e" />
            <!-- fringe -->
            <path d="M290,760 C300,600 420,545 545,550 C640,552 740,590 780,700 C700,640 640,650 590,700 C560,640 480,620 420,660 C400,700 360,730 290,760 Z" fill="#ff7b39" />
            <!-- giant pop-out eyes -->
            <ellipse cx="445" cy="800" rx="92" ry="118" fill="#fff" />
            <ellipse cx="640" cy="800" rx="92" ry="118" fill="#fff" />
            <circle cx="458" cy="828" r="30" fill="#1d1d2b" stroke="none" />
            <circle cx="626" cy="828" r="30" fill="#1d1d2b" stroke="none" />
            <circle cx="468" cy="816" r="10" fill="#fff" stroke="none" />
            <circle cx="636" cy="816" r="10" fill="#fff" stroke="none" />
            <!-- floating eyebrows, raised -->
            <path d="M370,640 Q440,600 505,640" fill="none" stroke-width="16" />
            <path d="M580,640 Q645,600 715,640" fill="none" stroke-width="16" />
            <!-- nose -->
            <path d="M540,880 C520,930 530,950 560,945" fill="none" stroke-width="9" />
            <!-- jaw-drop mouth -->
            <path d="M440,970 C450,1060 480,1140 540,1150 C600,1140 630,1060 640,970 C590,990 490,990 440,970 Z" fill="#7a1530" />
            <path d="M480,1100 C500,1070 580,1070 600,1100 C590,1135 560,1146 540,1146 C520,1146 490,1135 480,1100 Z" fill="#ff6b81" stroke-width="7" />
            <path d="M455,975 L625,975 L622,1000 L458,1000 Z" fill="#fff" stroke-width="7" />
            <!-- cheeks -->
            <ellipse cx="350" cy="930" rx="40" ry="24" fill="#ff8fa3" stroke="none" opacity=".8" />
            <ellipse cx="730" cy="930" rx="40" ry="24" fill="#ff8fa3" stroke="none" opacity=".8" />
            <!-- noodle arms + phone -->
            <path d="M400,1280 C300,1360 300,1460 420,1470" fill="none" />
            <path d="M680,1280 C780,1360 780,1460 660,1470" fill="none" />
            <g transform="rotate(-8 540 1450)">
              <rect x="420" y="1300" width="240" height="380" rx="34" fill="#1d1d2b" />
              <rect x="440" y="1322" width="200" height="330" rx="20" fill="#fff" stroke-width="6" />
              <rect x="465" y="1350" width="150" height="210" rx="10" fill="#8e7cc3" stroke-width="6" />
              <text x="540" y="1480" text-anchor="middle" font-family="Bangers" font-size="66" fill="#fff" stroke="none">2027</text>
            </g>
            <circle cx="425" cy="1468" r="42" fill="#ffcc9e" />
            <circle cx="655" cy="1468" r="42" fill="#ffcc9e" />
            <!-- surprise marks -->
            <path d="M200,560 l-60,-50 M210,640 l-80,0 M880,560 l60,-50 M870,640 l80,0" fill="none" stroke-width="14" />
          </g>
          <!-- title -->
          <g transform="rotate(-5 540 250)">
            <text x="540" y="300" text-anchor="middle" font-family="Bangers" font-size="158" fill="#e63946" stroke="#1d1d2b" stroke-width="14" paint-order="stroke fill" letter-spacing="4">¡¿QUÉ ES ESO?!</text>
          </g>
        </svg>
        <div class="label" style="color:#1d1d2b">1 · Cartoon de TV</div>
      </div>

      <!-- ============ B: ANIMACIÓN TIPO PELÍCULA 3D ============ -->
      <div id="b" class="scene clip" data-start="1" data-duration="1" data-track-index="0">
        <svg class="full" viewBox="0 0 1080 1920">
          <defs>
            <radialGradient id="bg3" cx="50%" cy="38%" r="80%"><stop offset="0" stop-color="#fff4e6" /><stop offset=".6" stop-color="#f7cfd8" /><stop offset="1" stop-color="#b9a3e3" /></radialGradient>
            <radialGradient id="skin" cx="42%" cy="35%" r="70%"><stop offset="0" stop-color="#ffe3cf" /><stop offset=".65" stop-color="#f6bfa0" /><stop offset="1" stop-color="#d98f72" /></radialGradient>
            <radialGradient id="hair" cx="40%" cy="25%" r="80%"><stop offset="0" stop-color="#8a5a3c" /><stop offset=".55" stop-color="#5a3622" /><stop offset="1" stop-color="#2e1b10" /></radialGradient>
            <radialGradient id="iris3" cx="50%" cy="60%" r="60%"><stop offset="0" stop-color="#9fe0c9" /><stop offset=".55" stop-color="#2f8f78" /><stop offset="1" stop-color="#174a3e" /></radialGradient>
            <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb35c" /><stop offset="1" stop-color="#e2773a" /></linearGradient>
            <radialGradient id="cheek" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff8f8f" stop-opacity=".7" /><stop offset="1" stop-color="#ff8f8f" stop-opacity="0" /></radialGradient>
            <radialGradient id="aoShadow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3a2340" stop-opacity=".35" /><stop offset="1" stop-color="#3a2340" stop-opacity="0" /></radialGradient>
            <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9b6ff" /><stop offset="1" stop-color="#8e7cc3" /></linearGradient>
            <filter id="soft"><feGaussianBlur stdDeviation="14" /></filter>
            <filter id="bokeh"><feGaussianBlur stdDeviation="8" /></filter>
          </defs>
          <rect width="1080" height="1920" fill="url(#bg3)" />
          <g filter="url(#bokeh)" opacity=".6">
            <circle cx="160" cy="420" r="70" fill="#fff" /><circle cx="920" cy="360" r="50" fill="#ffe08a" /><circle cx="880" cy="980" r="80" fill="#fff" /><circle cx="140" cy="1150" r="55" fill="#ffd1e8" /><circle cx="960" cy="1500" r="40" fill="#fff" />
          </g>
          <!-- floor contact shadow -->
          <ellipse cx="540" cy="1880" rx="380" ry="60" fill="url(#aoShadow)" />
          <!-- body (hoodie) -->
          <path d="M250,1920 C240,1500 360,1290 540,1290 C720,1290 840,1500 830,1920 Z" fill="url(#hood)" />
          <path d="M440,1310 C470,1380 610,1380 640,1310" fill="none" stroke="#c9622c" stroke-width="16" stroke-linecap="round" />
          <!-- hair back -->
          <path d="M250,860 C210,560 380,420 540,420 C700,420 870,560 830,860 C850,1050 800,1200 740,1260 L340,1260 C280,1200 230,1050 250,860 Z" fill="url(#hair)" />
          <!-- neck shadow -->
          <path d="M480,1190 L480,1300 Q540,1330 600,1300 L600,1190 Z" fill="#d98f72" />
          <!-- head -->
          <ellipse cx="540" cy="900" rx="285" ry="320" fill="url(#skin)" />
          <!-- ears -->
          <ellipse cx="262" cy="930" rx="40" ry="62" fill="#e9a98a" />
          <ellipse cx="818" cy="930" rx="40" ry="62" fill="#e9a98a" />
          <!-- fringe with highlight -->
          <path d="M255,840 C250,600 400,520 560,520 C720,520 840,620 825,820 C770,700 690,650 600,640 C620,690 610,720 590,740 C560,680 490,650 420,660 C380,720 320,780 255,840 Z" fill="url(#hair)" />
          <path d="M360,640 C430,580 520,560 600,566" fill="none" stroke="#c48a63" stroke-width="18" stroke-linecap="round" opacity=".7" />
          <!-- eyes: big, glossy, wide open in awe -->
          <g>
            <ellipse cx="430" cy="930" rx="88" ry="104" fill="#fff" />
            <ellipse cx="650" cy="930" rx="88" ry="104" fill="#fff" />
            <ellipse cx="430" cy="938" rx="66" ry="76" fill="url(#iris3)" />
            <ellipse cx="650" cy="938" rx="66" ry="76" fill="url(#iris3)" />
            <circle cx="430" cy="945" r="34" fill="#0f1f1a" />
            <circle cx="650" cy="945" r="34" fill="#0f1f1a" />
            <ellipse cx="404" cy="904" rx="22" ry="26" fill="#fff" />
            <ellipse cx="624" cy="904" rx="22" ry="26" fill="#fff" />
            <circle cx="456" cy="976" r="10" fill="#fff" opacity=".85" />
            <circle cx="676" cy="976" r="10" fill="#fff" opacity=".85" />
            <path d="M335,880 C360,810 500,800 525,868" fill="none" stroke="#2e1b10" stroke-width="12" stroke-linecap="round" />
            <path d="M555,868 C580,800 720,810 745,880" fill="none" stroke="#2e1b10" stroke-width="12" stroke-linecap="round" />
          </g>
          <!-- raised brows -->
          <path d="M350,760 Q430,720 510,752" fill="none" stroke="#4a2c1a" stroke-width="20" stroke-linecap="round" />
          <path d="M570,752 Q650,720 730,760" fill="none" stroke="#4a2c1a" stroke-width="20" stroke-linecap="round" />
          <!-- cheeks -->
          <ellipse cx="350" cy="1060" rx="70" ry="44" fill="url(#cheek)" />
          <ellipse cx="730" cy="1060" rx="70" ry="44" fill="url(#cheek)" />
          <!-- nose -->
          <ellipse cx="540" cy="1040" rx="30" ry="22" fill="#e9a184" />
          <ellipse cx="530" cy="1032" rx="10" ry="6" fill="#fff" opacity=".5" />
          <!-- open smile with teeth -->
          <path d="M455,1110 C470,1190 610,1190 625,1110 C590,1125 490,1125 455,1110 Z" fill="#6d2333" />
          <path d="M470,1114 C500,1126 580,1126 610,1114 L606,1132 C580,1140 500,1140 474,1132 Z" fill="#fff" />
          <ellipse cx="540" cy="1170" rx="38" ry="14" fill="#ff8a8a" />
          <!-- hands + phone glowing on the face -->
          
          <g transform="rotate(-6 540 1560)">
            <rect x="420" y="1410" width="240" height="380" rx="38" fill="#2a2433" />
            <rect x="438" y="1430" width="204" height="340" rx="26" fill="url(#screenGlow)" />
            <text x="540" y="1630" text-anchor="middle" font-family="Bangers" font-size="76" fill="#fff">2027</text>
          </g>
          <ellipse cx="420" cy="1600" rx="56" ry="50" fill="url(#skin)" />
          <ellipse cx="660" cy="1600" rx="56" ry="50" fill="url(#skin)" />
          <!-- title -->
          <text x="540" y="300" text-anchor="middle" font-family="Bangers" font-size="170" fill="#fff" stroke="#6b4ab0" stroke-width="14" paint-order="stroke fill" letter-spacing="3">¡QUÉ HERMOSA!</text>
        </svg>
        <div class="label" style="color:#3a2340">2 · Animación tipo película 3D</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
