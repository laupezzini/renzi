    <style>
      @font-face {
        font-family: "DM Sans";
        src: url("assets/fonts/dmsans-500.woff2") format("woff2");
        font-weight: 500;
      }
      @font-face {
        font-family: "DM Sans";
        src: url("assets/fonts/dmsans-800.woff2") format("woff2");
        font-weight: 800;
      }
      @font-face {
        font-family: "Caveat";
        src: url("assets/fonts/caveat-700.woff2") format("woff2");
        font-weight: 700;
      }
      :root {
        --cream: #fbf6ec;
        --ink: #2b2340;
        --pink: #e85d8a;
        --lilac: #8e7cc3;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #120f1a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "DM Sans", sans-serif;
      }
      video.shot,
      .still {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .still-wrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      /* top scrim keeps copy legible over busy footage */
      .scrim {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 900px;
        background: linear-gradient(to bottom, rgba(18, 15, 26, 0.55), rgba(18, 15, 26, 0));
      }
      .card {
        position: absolute;
        left: 70px;
        right: 70px;
        top: 300px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 18px;
      }
      .tag {
        display: block;
        background: var(--cream);
        color: var(--ink);
        font-weight: 800;
        font-size: 74px;
        line-height: 1.04;
        letter-spacing: -1px;
        padding: 18px 30px 22px;
        border-radius: 14px;
        box-shadow: 0 10px 0 rgba(43, 35, 64, 0.35);
      }
      .tag.pink {
        background: var(--pink);
        color: #fff;
      }
      .tag.fit {
        font-size: 62px;
        white-space: nowrap;
      }
      .tag.small {
        font-size: 46px;
        font-weight: 500;
        padding: 14px 26px 16px;
      }
      .word {
        position: absolute;
        left: 0;
        right: 0;
        top: 330px;
        display: flex;
        justify-content: center;
      }
      .word span {
        display: block;
        background: var(--cream);
        color: var(--ink);
        font-weight: 800;
        font-size: 128px;
        letter-spacing: -2px;
        padding: 6px 40px 18px;
        border-radius: 18px;
        box-shadow: 0 12px 0 rgba(43, 35, 64, 0.35);
      }
      .word.pink span {
        background: var(--pink);
        color: #fff;
      }
      .script {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 300px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        text-align: center;
        font-family: "Caveat", cursive;
        font-weight: 700;
        font-size: 120px;
        line-height: 1.05;
        color: var(--ink);
      }
      .script span {
        display: block;
        background: rgba(251, 246, 236, 0.94);
        padding: 4px 38px 14px;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }
      .brand {
        position: absolute;
        left: 0;
        right: 0;
        top: 1440px;
        display: flex;
        justify-content: center;
      }
      .brand span {
        display: block;
        background: rgba(43, 35, 64, 0.88);
        color: var(--cream);
        font-weight: 500;
        font-size: 42px;
        padding: 14px 30px 16px;
        border-radius: 999px;
      }
      .brand b {
        font-family: "Caveat", cursive;
        font-weight: 700;
        font-size: 58px;
        color: #fff;
      }
      .flash {
        position: absolute;
        inset: 0;
        background: #fff;
        opacity: 0;
      }
    </style>
  </head>
