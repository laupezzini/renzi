<div class="hdr"><i></i>RENZI · CUADERNOS HECHOS A MANO<i></i></div>
<div id="c" class="g"></div></div>
<script>
const C=document.getElementById('c');
const G='#2f5d46',R='#d6456b',BL='#f8cdd5',SG='#9dbf9f',SG2='#6f9a7e',CR='#fffdf8',LN='#e4dccf',BR='#5b4a45',WD='#b98b6e';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-cl(x),3), eb=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const SH='filter:drop-shadow(0 24px 30px rgba(90,60,40,.18))';
function win(t,a,b,f=.35){return cl(Math.min((t-a)/f,(b-t)/f))}
function pop(t,a,d=.45){const x=eb((t-a)/d);return `opacity:${cl((t-a)/.15)};transform:translateY(${(1-x)*40}px) scale(${.85+.15*x})`}
function clock(cx,cy,r,ang){return `<g style="${SH}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="${CR}" stroke="${G}" stroke-width="12"/><circle cx="${cx}" cy="${cy}" r="${r-26}" fill="none" stroke="${LN}" stroke-width="3"/>`+
 [...Array(12)].map((_,i)=>{const a=i*Math.PI/6;return `<line x1="${cx+Math.sin(a)*(r-48)}" y1="${cy-Math.cos(a)*(r-48)}" x2="${cx+Math.sin(a)*(r-30)}" y2="${cy-Math.cos(a)*(r-30)}" stroke="${G}" stroke-width="${i%3?5:10}" stroke-linecap="round"/>`}).join('')+
 `<line x1="${cx}" y1="${cy}" x2="${cx+Math.sin(ang/12)*r*.45}" y2="${cy-Math.cos(ang/12)*r*.45}" stroke="${G}" stroke-width="16" stroke-linecap="round"/>`+
 `<line x1="${cx}" y1="${cy}" x2="${cx+Math.sin(ang)*r*.7}" y2="${cy-Math.cos(ang)*r*.7}" stroke="${R}" stroke-width="10" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="16" fill="${R}"/></g>`}
function stack(n,cx,by){let s='';for(let i=0;i<n;i++){const y=by-i*15;s+=`<path d="M${cx-300} ${y} L${cx+200} ${y} L${cx+300} ${y-90} L${cx-200} ${y-90}Z" fill="${i%2?'#ffffff':CR}" stroke="${LN}" stroke-width="2.5"/>`}return `<g style="${SH}">${s}</g>`}
function T2(a,b,t,t0){return `<div class="mid" style="${pop(t,t0)}">${a}</div><div class="scr" style="${pop(t,t0+.3)}">${b}</div>`}
function scene(t){let h='';
 // 1 · gancho
 let o=win(t,0,2.8);if(o>0){h+=`<div class="g" style="opacity:${o}"><div class="tt" style="top:300px"><div class="mid" style="${pop(t,.1)}">¿Cuánto lleva</div><div class="mid" style="${pop(t,.4)}">hacer una agenda</div><div class="scr" style="${pop(t,.75)}">a mano?</div></div>
 <svg class="g" width="1080" height="1920"><g style="transform-origin:540px 1250px;transform:scale(${eb((t-.3)/.6)})">${clock(540,1250,240,t*4)}</g></svg></div>`}
 // 2 · 420 hojas
 o=win(t,2.6,5.8);if(o>0){const x=eo((t-2.8)/2.2),n=Math.round(420*x);h+=`<div class="g" style="opacity:${o}"><div class="tt" style="top:280px"><div class="big" style="font-size:240px;color:${R}">${n}</div><div class="mid">hojas</div></div>
 <svg class="g" width="1080" height="1920">${stack(Math.round(1+x*34),540,1520)}</svg></div>`}
 // 3 · dobladas una por una
 o=win(t,5.6,8.8);if(o>0){const ph=((t-5.8)/1.2)%1,f=Math.cos(cl(ph*1.4)*Math.PI),k=Math.floor(Math.max(0,t-5.8)/1.2)+1;
  const lines=(x0)=>[...Array(9)].map((_,i)=>`<line x1="${x0}" x2="${x0+270}" y1="${1000+i*45}" y2="${1000+i*45}" stroke="${LN}" stroke-width="3"/>`).join('');
  h+=`<div class="g" style="opacity:${o}"><div class="tt" style="top:300px">${T2('dobladas','una por una',t,5.8)}</div>
  <svg class="g" width="1080" height="1920"><g style="${SH}"><rect x="190" y="920" width="350" height="500" fill="#fff" stroke="${LN}" stroke-width="3"/>${lines(230)}
  <g transform="translate(540 0) scale(${f} 1)"><rect x="0" y="920" width="350" height="500" fill="${f>0?'#fff':BL}" stroke="${LN}" stroke-width="3"/>${f>0?lines(40):''}</g></g>
  <line x1="540" x2="540" y1="910" y2="1430" stroke="${WD}" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="540" y="1530" text-anchor="middle" font-family="H" font-size="80" fill="${R}">n.º ${Math.min(k,99)}</text></svg></div>`}
 // 4 · cosidas hilo por hilo
